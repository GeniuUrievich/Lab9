name: Run Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Настройка Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Проверка структуры файлов
      run: |
        echo "=== СТРУКТУРА КАТАЛОГОВ ==="
        pwd
        find . -maxdepth 3 -not -path '*/.*'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f Lab9/requirements.txt ]; then pip install -r Lab9/requirements.txt; fi

    - name: Поиск и запуск pytest
      run: |
        echo "=== ЗАПУСК ТЕСТОВ ==="
        # Ищем все файлы test_*.py и запускаем pytest в папке, где они найдены
        TEST_DIR=$(find . -name "test_*.py" -exec dirname {} \; | head -n 1)
        
        if [ -z "$TEST_DIR" ]; then
          echo "ОШИБКА: Ни один файл test_*.py не найден в репозитории!"
          exit 1
        fi

        echo "Тесты найдены в директории: $TEST_DIR"
        pytest -v "$TEST_DIR"